name: typing-system-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - '${DEV_PORT:-5173}:5173'
    environment:
      DATABASE_URL: /app/data/typing-system.db
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
      - dev_data:/app/data
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  dev_node_modules:
  dev_data:
