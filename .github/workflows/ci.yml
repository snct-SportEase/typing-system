name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DATABASE_URL: data/ci.db
  TOURNAMENT_NAME: CI Tournament
  ADMIN_USERNAME: ci-admin
  ADMIN_PASSWORD: ci-password

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Check formatting and lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit -- --run

      - name: Build application
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare Compose environment
        run: cp .env.example .env

      - name: Validate Compose files
        run: |
          docker compose -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.production.yml config --quiet

      - name: Build production image
        run: docker build --tag typing-system:ci .

  deploy:
    name: Deploy to Server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - quality
      - e2e
      - container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions: {}
    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          TARGET_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 20m
          command_timeout: 20m
          envs: TARGET_SHA
          script: |
            set -eu

            if [ ! -d "$HOME/typing-system/.git" ]; then
              echo "$HOME/typing-system is not cloned on the server" >&2
              exit 1
            fi
            cd "$HOME/typing-system"

            git fetch origin main
            git checkout main
            git merge --ff-only origin/main
            test "$(git rev-parse HEAD)" = "$TARGET_SHA"

            if [ ! -f .env ]; then
              echo "$HOME/typing-system/.env is not configured" >&2
              exit 1
            fi
            docker network inspect typing-public >/dev/null
            test "$(docker inspect -f '{{.State.Health.Status}}' sportease-edge-traefik)" = "healthy"
            docker compose -f docker-compose.production.yml config --quiet

            docker compose -f docker-compose.production.yml build --pull
            docker compose -f docker-compose.production.yml up -d

            i=0
            until [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose -f docker-compose.production.yml ps -q app)" 2>/dev/null || true)" = "healthy" ]; do
              i=$((i + 1))
              if [ "$i" -ge 30 ]; then
                docker compose -f docker-compose.production.yml logs --tail=100 app
                exit 1
              fi
              sleep 2
            done

            curl -fsS --retry 10 --retry-delay 2 --retry-all-errors https://typing-system.nitsche-gyouji.com/api/health >/dev/null
