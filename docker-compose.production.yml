name: typing-system-production

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000'
    environment:
      DATABASE_URL: /app/data/typing-system.db
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - production_data:/app/data
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  production_data:
